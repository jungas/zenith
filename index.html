<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Zenith · Budget &amp; cards</title>
    <meta
      name="description"
      content="Envelope budgeting with credit card management wired straight into the budget."
    />
    <meta name="theme-color" content="#f9f9f7" />
    <meta name="color-scheme" content="light dark" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Zenith" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/components.css" />
    <link rel="stylesheet" href="./styles/views.css" />
    <link rel="stylesheet" href="./styles/glass.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="app" class="app">
      <div class="boot">
        <p class="boot-text">Loading Zenith…</p>
      </div>
    </div>

    <noscript>
      <p style="padding: 2rem; text-align: center">
        Zenith needs JavaScript — all of its budgeting runs locally in your browser.
      </p>
    </noscript>

    <script type="module">
      // This file is served two ways: as-is (a static host — GitHub Pages,
      // `file://`, any plain web server) or through Zenith's own server
      // (`server/index.ts`), which injects a `window.__ZENITH_BACKEND__ =
      // 'server'` script into the <head> before sending it. `store.ts` reads
      // that flag: present, it loads from and saves to this server's own
      // `/api/state`; absent — the case right here in the checked-in file —
      // it falls back to localStorage, which is what makes a plain static
      // deploy or a double-clicked `file://index.html` work with no server
      // at all.
      import { init } from './dist/store.js';
      import { start } from './dist/app.js';

      init()
        .then(start)
        .catch((error) => {
          console.error('Zenith could not load its data', error);
          const app = document.getElementById('app');
          app.innerHTML = `
            <div class="view">
              <div class="callout callout-critical">
                <div class="callout-body">
                  <h3 class="callout-title">Could not reach Zenith's server</h3>
                  <p class="callout-text" data-error-detail></p>
                  <p class="callout-text">Check that the server is running, then reload.</p>
                </div>
              </div>
              <button type="button" class="btn" onclick="location.reload()">Reload</button>
            </div>`;
          // Set as text, not interpolated into the markup above — the error
          // message can echo back whatever the server (or a network layer in
          // between) sent, and it must never be parsed as HTML.
          app.querySelector('[data-error-detail]').textContent =
            error instanceof Error ? error.message : 'Unknown error';
        });
    </script>
  </body>
</html>
